<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FG Digital Systems | Diseño Web y SEO para Pymes</title>
    
    <!-- 1. DNS & Preconnect: Warm up connections early -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://esm.sh">
    <link rel="preconnect" href="https://i.imgur.com">
    <link rel="preconnect" href="https://images.unsplash.com">
    <link rel="dns-prefetch" href="https://i.imgur.com">
    <link rel="dns-prefetch" href="https://images.unsplash.com">
    <link rel="dns-prefetch" href="https://esm.sh">
    
    <!-- 2. Critical Font Preload -->
    <link rel="preload" href="https://fonts.gstatic.com/s/inter/v18/UcCO3FwrX2iLndDcAP_0gxJubA.woff2" as="font" type="font/woff2" crossorigin>

    <!-- 3. Critical CSS: Inlined for 0ms visual render -->
    <style>
      :root { --blue-600: #2563eb; --slate-900: #0f172a; --slate-600: #475569; --slate-50: #f8fafc; }
      body { margin: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: var(--slate-50); color: var(--slate-900); -webkit-font-smoothing: antialiased; font-display: swap; }
      #root { min-height: 100vh; display: flex; flex-direction: column; }
      .hero-section { min-height: 70vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(to bottom, #fff, var(--slate-50)); text-align: center; padding: 4rem 1rem; contain: content; }
      @media (min-width: 768px) { .hero-section { padding-top: 8rem; padding-bottom: 6rem; } }
      .lcp-title { font-size: 2.25rem; font-weight: 800; line-height: 1.1; color: var(--slate-900); margin-bottom: 1.5rem; letter-spacing: -0.025em; max-width: 900px; margin-left: auto; margin-right: auto; }
      @media (min-width: 768px) { .lcp-title { font-size: 4.5rem; } }
      .lcp-title span { color: var(--blue-600); }
      .hero-sub { font-size: 1.125rem; color: var(--slate-600); margin-bottom: 2.5rem; max-width: 42rem; margin-left: auto; margin-right: auto; line-height: 1.6; }
      .navbar-placeholder { height: 64px; background: white; border-bottom: 1px solid #e2e8f0; width: 100%; position: sticky; top: 0; z-index: 50; }
    </style>

    <!-- 4. Async Non-blocking CSS -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" media="print" onload="this.media='all'">

    <!-- 5. Tailwind CDN with performance optimizations -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
                    colors: {
                        blue: { 50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd', 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a' },
                    },
                }
            }
        }
    </script>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react/": "https://esm.sh/react@^19.2.3/",
        "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
        "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0",
        "vite": "https://esm.sh/vite@^7.3.1",
        "react-router": "https://esm.sh/react-router@^7.12.0"
      }
    }
    </script>
    <link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root">
        <!-- Initial skeleton for zero-CLS -->
        <div class="navbar-placeholder"></div>
        <div class="hero-section">
            <div style="max-width: 900px; margin: 0 auto; padding: 0 1rem;">
                <h1 class="lcp-title">¿Tu web trae <span>clientes</span> o solo facturas?</h1>
                <div style="height: 100px;"></div>
            </div>
        </div>
    </div>
    <script type="module" src="/index.tsx" defer></script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
