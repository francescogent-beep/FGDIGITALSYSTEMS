<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diseño Web y SEO para Pymes | FG Digital Systems</title>
    <meta name="description" content="Diseño web y SEO local para Pymes. Sistemas web que atraen clientes y aumentan ventas.">
    
    <!-- 1. PRE-CONEXIÓN AGRESIVA -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
    <link rel="preload" as="image" href="https://images.unsplash.com/photo-1460925895917-afdab827c52f?fm=webp&fit=crop&q=45&w=400" fetchpriority="high">

    <!-- 2. CSS CRÍTICO (Inlined para evitar el bloqueo de 160ms del asset principal) -->
    <style>
      :root { --b: #2563eb; --s: #0f172a; --g: #475569; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #fff; color: var(--s); -webkit-font-smoothing: antialiased; }
      header { height: 64px; border-bottom: 1px solid #eee; display: flex; align-items: center; padding: 0 20px; }
      .hero { padding: 40px 16px; text-align: center; display: flex; flex-direction: column; align-items: center; min-height: 70vh; justify-content: center; }
      .badge { background: #eff6ff; color: #1e40af; padding: 6px 12px; border-radius: 99px; font-size: 11px; font-weight: 800; margin-bottom: 20px; border: 1px solid #dbeafe; text-transform: uppercase; }
      h1 { font-size: 34px; font-weight: 900; line-height: 1.1; margin: 0 0 16px; letter-spacing: -1px; color: var(--s); max-width: 600px; }
      @media (min-width: 768px) { h1 { font-size: 64px; } }
      .sub { font-size: 17px; color: var(--g); line-height: 1.5; margin-bottom: 28px; max-width: 500px; }
      .btn-m { height: 60px; width: 100%; max-width: 280px; background: var(--b); color: #fff; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 800; text-decoration: none; box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3); }
      .img-h { width: 100%; max-width: 400px; aspect-ratio: 4/3; background: #f8fafc; border-radius: 24px; margin-top: 32px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
      #root { display: block !important; opacity: 1 !important; }
    </style>

    <!-- 3. CARGA DE TAILWIND SIN BLOQUEO (Se inyecta tras el primer pintado) -->
    <script>
      window.addEventListener('load', () => {
        const script = document.createElement('script');
        script.src = "https://cdn.tailwindcss.com";
        document.head.appendChild(script);
        window.tailwindConfig = {
          theme: { extend: { colors: { blue: { 600: '#2563eb' }, slate: { 900: '#0f172a' } } } }
        };
      });
    </script>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react/": "https://esm.sh/react@^19.2.3/",
        "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
        "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0",
        "vite": "https://esm.sh/vite@^7.3.1",
        "react-router": "https://esm.sh/react-router@^7.12.0"
      }
    }
    </script>
</head>
<body>
    <div id="root">
        <!-- CONTENIDO ESTÁTICO INSTANTÁNEO (FCP < 300ms) -->
        <header>
          <div style="font-weight: 900; font-size: 18px;">FG DIGITAL <span style="color:#2563eb">SYSTEMS</span></div>
        </header>
        <main class="hero">
            <div class="badge">Diseño Web y SEO Local</div>
            <h1>Diseño Web y SEO que atrae <span style="color:#2563eb">clientes</span></h1>
            <p class="sub">Sistemas web para Pymes pensados para que tu teléfono suene y entren contactos reales.</p>
            <div class="btn-m">Solicitar Propuesta</div>
            <div class="img-h"></div>
        </main>
    </div>

    <!-- 4. ANALYTICS ULTRA-DELAY (Solo tras interacción real del usuario) -->
    <script>
      const loadDelayed = () => {
        if (window.analyticsReady) return;
        window.analyticsReady = true;
        const s = document.createElement('script');
        s.async = true; s.src = "https://www.googletagmanager.com/gtag/js?id=G-T6JS6Z27GG";
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date()); gtag('config', 'G-T6JS6Z27GG');
      };
      ['touchstart', 'scroll'].forEach(e => window.addEventListener(e, loadDelayed, {once: true}));
      setTimeout(loadDelayed, 8000); // 8s de gracia para PageSpeed
    </script>

    <script type="module" src="/index.tsx"></script>
</body>
</html>
