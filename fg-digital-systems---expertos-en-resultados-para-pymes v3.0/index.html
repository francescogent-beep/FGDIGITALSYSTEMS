<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diseño Web y SEO para Pymes | FG Digital Systems</title>
    <meta name="description" content="Diseño web y SEO local para Pymes. Creamos sistemas web que atraen clientes y aumentan las ventas sin cuotas mensuales ni tecnicismos en Murcia y España.">
    
    <!-- 1. Preload de Recurso LCP (Imagen Crítica) -->
    <link rel="preload" as="image" href="https://images.unsplash.com/photo-1460925895917-afdab827c52f?fm=webp&fit=crop&q=60&w=600" fetchpriority="high">

    <!-- 2. Optimización de Conexiones -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://www.googletagmanager.com">

    <!-- 3. CSS CRÍTICO (Pintura instantánea sin depender de Tailwind/React) -->
    <style>
      :root { --blue-600: #2563eb; --slate-900: #0f172a; --slate-700: #334155; --white: #ffffff; }
      body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: #f8fafc; -webkit-font-smoothing: antialiased; }
      .nav-fixed { height: 64px; background: rgba(255,255,255,0.9); border-bottom: 1px solid #e2e8f0; position: fixed; top: 0; width: 100%; z-index: 100; }
      .hero-fast { padding-top: 100px; padding-bottom: 40px; text-align: center; background: var(--white); display: flex; flex-direction: column; align-items: center; px: 20px; }
      .title-fast { font-size: 2.25rem; font-weight: 800; color: var(--slate-900); margin-bottom: 1rem; line-height: 1.1; max-width: 90%; letter-spacing: -0.025em; }
      @media (min-width: 768px) { .title-fast { font-size: 4.5rem; } }
      .sub-fast { color: var(--slate-700); font-size: 1.1rem; max-width: 600px; line-height: 1.5; margin: 0 auto 2rem; padding: 0 20px; }
      .btn-fast { height: 58px; width: 260px; background: var(--blue-600); border-radius: 1rem; border: none; }
      #root { opacity: 0; transition: opacity 0.2s ease-in; }
      #root.loaded { opacity: 1; }
    </style>

    <!-- 4. Tailwind Engine (Carga diferida para no bloquear el FCP) -->
    <script src="https://cdn.tailwindcss.com" defer></script>
    <script>
      window.tailwindConfig = {
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'sans-serif'] },
            colors: {
              blue: { 50: '#f0f9ff', 600: '#2563eb', 700: '#1d4ed8', 900: '#1e3a8a' },
              slate: { 700: '#334155', 800: '#1e293b', 900: '#0f172a' }
            }
          }
        }
      };
      // Aplicar config cuando cargue el script
      document.addEventListener('DOMContentLoaded', () => {
        if(window.tailwind) window.tailwind.config = window.tailwindConfig;
      });
    </script>

    <!-- 5. GTM No Bloqueante (Carga tras 2.5s para no penalizar el TBT) -->
    <script>
      setTimeout(() => {
        const script = document.createElement('script');
        script.async = true;
        script.src = "https://www.googletagmanager.com/gtag/js?id=G-T6JS6Z27GG";
        document.head.appendChild(script);
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-T6JS6Z27GG');
      }, 2500);
    </script>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react/": "https://esm.sh/react@^19.2.3/",
        "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
        "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0",
        "vite": "https://esm.sh/vite@^7.3.1",
        "react-router": "https://esm.sh/react-router@^7.12.0"
      }
    }
    </script>
</head>
<body>
    <!-- Pintura inicial instantánea (Skeleton funcional) -->
    <div id="loading-overlay" style="position: absolute; width: 100%;">
        <div class="nav-fixed"></div>
        <div class="hero-fast">
            <div class="title-fast">Diseño Web y SEO que atrae <span style="color:var(--blue-600)">clientes</span></div>
            <p class="sub-fast">Creamos sistemas web para Pymes que funcionan y te posicionan en Google en tiempo récord.</p>
            <div class="btn-fast"></div>
        </div>
    </div>

    <div id="root"></div>

    <script type="module">
        // Quitar el overlay cuando React esté listo
        window.addEventListener('load', () => {
            const root = document.getElementById('root');
            const overlay = document.getElementById('loading-overlay');
            if (overlay) overlay.style.display = 'none';
            root.classList.add('loaded');
        });
    </script>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
