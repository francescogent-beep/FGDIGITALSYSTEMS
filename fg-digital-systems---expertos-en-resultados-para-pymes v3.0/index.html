<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diseño Web y SEO para Pymes | FG Digital Systems</title>
    <meta name="description" content="Diseño web y SEO local para Pymes. Sistemas web que atraen clientes y aumentan ventas sin cuotas mensuales.">
    
    <!-- 1. OPTIMIZACIÓN DE CONEXIÓN -->
    <link rel="preconnect" href="https://images.unsplash.com">
    <link rel="preload" as="image" href="https://images.unsplash.com/photo-1460925895917-afdab827c52f?fm=webp&fit=crop&q=40&w=500" fetchpriority="high">

    <!-- 2. CSS CRÍTICO MANUAL (Sustituye a Tailwind durante los primeros 2s) -->
    <style>
      :root { --p: #2563eb; --s: #0f172a; --t: #475569; --w: #ffffff; }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--w); color: var(--s); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
      header { height: 64px; background: rgba(255,255,255,0.9); border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; padding: 0 20px; position: sticky; top: 0; z-index: 50; }
      .logo { font-weight: 900; font-size: 20px; text-transform: uppercase; letter-spacing: -1px; }
      .logo span { color: var(--p); }
      .hero { padding: 40px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; min-height: 80vh; justify-content: center; }
      .badge { background: #eff6ff; color: #1e40af; padding: 6px 16px; border-radius: 99px; font-size: 12px; font-weight: 800; margin-bottom: 24px; border: 1px solid #dbeafe; text-transform: uppercase; }
      h1 { font-size: 38px; font-weight: 900; line-height: 1.1; margin: 0 0 20px; letter-spacing: -1.5px; max-width: 800px; color: var(--s); }
      @media (min-width: 768px) { h1 { font-size: 72px; } }
      .sub { font-size: 18px; color: var(--t); line-height: 1.6; margin-bottom: 32px; max-width: 600px; font-weight: 500; }
      .btn { height: 64px; width: 280px; background: var(--p); color: #fff; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-weight: 900; text-decoration: none; box-shadow: 0 20px 25px -5px rgba(37, 99, 235, 0.2); }
      .lcp-img { width: 100%; max-width: 600px; aspect-ratio: 16/10; background: #f3f4f6; border-radius: 32px; margin-top: 40px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.1); }
      #root { display: block !important; }
    </style>

    <!-- 3. CARGA NO BLOQUEANTE DE TAILWIND (El truco definitivo) -->
    <link rel="preload" href="https://cdn.tailwindcss.com" as="script">
    <script>
      // Cargamos Tailwind después de que la página sea interactiva
      window.addEventListener('DOMContentLoaded', () => {
        const script = document.createElement('script');
        script.src = "https://cdn.tailwindcss.com";
        script.defer = true;
        document.head.appendChild(script);
        
        window.tailwindConfig = {
          theme: { extend: { colors: { blue: { 600: '#2563eb' }, slate: { 900: '#0f172a' } } } }
        };
      });
    </script>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react/": "https://esm.sh/react@^19.2.3/",
        "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
        "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0",
        "vite": "https://esm.sh/vite@^7.3.1",
        "react-router": "https://esm.sh/react-router@^7.12.0"
      }
    }
    </script>
</head>
<body>
    <div id="root">
        <!-- RENDER INSTANTÁNEO: Esto se ve en < 200ms -->
        <header>
            <div class="logo">FG DIGITAL <span>SYSTEMS</span></div>
        </header>
        <main class="hero">
            <div class="badge">Diseño Web y SEO Local</div>
            <h1>Diseño Web y SEO que atrae <span>clientes</span></h1>
            <p class="sub">Creamos sistemas web pensados para que tu teléfono suene y entren contactos reales.</p>
            <div class="btn">Solicitar Propuesta</div>
            <div class="lcp-img"></div>
        </main>
    </div>

    <!-- 4. ANALYTICS EN SEGUNDO PLANO (Solo carga tras interacción o 6s) -->
    <script>
      const loadGTM = () => {
        if (window.gtmLoaded) return;
        window.gtmLoaded = true;
        const s = document.createElement('script');
        s.async = true; s.src = "https://www.googletagmanager.com/gtag/js?id=G-T6JS6Z27GG";
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date()); gtag('config', 'G-T6JS6Z27GG');
      };
      ['touchstart', 'scroll', 'mouseover'].forEach(ev => window.addEventListener(ev, loadGTM, {once: true}));
      setTimeout(loadGTM, 6000);
    </script>

    <script type="module" src="/index.tsx"></script>
</body>
</html>
