<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diseño Web y SEO para Pymes | FG Digital Systems</title>
    <meta name="description" content="Diseño web y SEO local para Pymes. Sistemas web que atraen clientes y aumentan ventas sin cuotas mensuales.">
    
    <!-- 1. PRECARGA LCP (Sin esta línea el LCP nunca bajará de 3s) -->
    <link rel="preload" as="image" href="https://images.unsplash.com/photo-1460925895917-afdab827c52f?fm=webp&fit=crop&q=50&w=600" fetchpriority="high">

    <!-- 2. CSS CRÍTICO NATIVO (Estila el HTML antes de que Tailwind cargue) -->
    <style>
      :root { --b: #2563eb; --d: #0f172a; --g: #475569; }
      body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: #fff; color: var(--d); overflow-x: hidden; }
      header { height: 64px; background: #fff; border-bottom: 1px solid #eee; }
      .hero-fast { padding: 40px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; min-height: 80vh; justify-content: center; }
      .h1-fast { font-size: 2.5rem; font-weight: 900; margin: 0 0 20px; line-height: 1.1; letter-spacing: -1px; max-width: 900px; }
      @media (min-width: 768px) { .h1-fast { font-size: 4.5rem; } }
      .p-fast { font-size: 1.1rem; color: var(--g); line-height: 1.6; margin-bottom: 30px; max-width: 600px; font-weight: 500; }
      .btn-fast { height: 60px; width: 280px; background: var(--b); border-radius: 12px; border: none; box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3); }
      .blue-t { color: var(--b); }
      #root { display: block !important; opacity: 1 !important; }
      /* Evitar saltos de layout del Hero */
      .hero-placeholder { aspect-ratio: 16/9; width: 100%; max-width: 600px; background: #f3f4f6; border-radius: 24px; margin-top: 40px; }
    </style>

    <!-- 3. TAILWIND (Carga no bloqueante) -->
    <script src="https://cdn.tailwindcss.com" defer></script>
    <script>
      window.tailwindConfig = {
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'sans-serif'] },
            colors: { blue: { 600: '#2563eb' }, slate: { 900: '#0f172a' } }
          }
        }
      };
    </script>

    <!-- 4. GTM ULTRA-LAZY (Libera el Main Thread del móvil) -->
    <script>
      function loadAnalytics() {
        if (window.gtmInitialized) return;
        window.gtmInitialized = true;
        const s = document.createElement('script');
        s.async = true; s.src = "https://www.googletagmanager.com/gtag/js?id=G-T6JS6Z27GG";
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date()); gtag('config', 'G-T6JS6Z27GG');
      }
      // Solo carga cuando el usuario realmente interactúa
      window.addEventListener('scroll', loadAnalytics, {once: true});
      window.addEventListener('touchstart', loadAnalytics, {once: true});
      setTimeout(loadAnalytics, 5000); 
    </script>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react/": "https://esm.sh/react@^19.2.3/",
        "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
        "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0",
        "vite": "https://esm.sh/vite@^7.3.1",
        "react-router": "https://esm.sh/react-router@^7.12.0"
      }
    }
    </script>
</head>
<body>
    <div id="root">
        <!-- Skeleton estático: Se pisa automáticamente cuando React carga -->
        <header></header>
        <main class="hero-fast">
            <h1 class="h1-fast">Diseño Web y SEO que atrae <span class="blue-t">clientes</span></h1>
            <p class="p-fast">Sistemas web para Pymes pensados para que tu teléfono suene y entren contactos reales.</p>
            <div class="btn-fast"></div>
            <div class="hero-placeholder"></div>
        </main>
    </div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
