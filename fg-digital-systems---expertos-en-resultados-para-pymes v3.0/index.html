<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diseño Web y SEO para Pymes | FG Digital Systems</title>
    <meta name="description" content="Diseño web y SEO local para Pymes. Sistemas web que atraen clientes y aumentan ventas sin cuotas mensuales.">
    
    <!-- 1. PRECARGA LCP (URL exacta optimizada para móvil) -->
    <link rel="preload" as="image" href="https://images.unsplash.com/photo-1460925895917-afdab827c52f?fm=webp&fit=crop&q=60&w=640" fetchpriority="high">

    <!-- 2. CSS CRÍTICO (Renderizado en < 1s) -->
    <style>
      :root { --blue: #2563eb; --slate-900: #0f172a; --slate-600: #475569; --white: #ffffff; }
      body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #fff; -webkit-font-smoothing: antialiased; }
      .nav-shell { height: 64px; background: #fff; border-bottom: 1px solid #e2e8f0; }
      .hero-shell { padding: 40px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; }
      .tag-shell { background: #eff6ff; color: #1e40af; padding: 6px 16px; border-radius: 99px; font-size: 12px; font-weight: 700; margin-bottom: 24px; border: 1px solid #dbeafe; text-transform: uppercase; letter-spacing: 1px; }
      .h1-shell { font-size: 40px; font-weight: 900; color: var(--slate-900); line-height: 1.1; margin: 0 0 24px; letter-spacing: -1px; max-width: 800px; }
      @media (min-width: 768px) { .h1-shell { font-size: 72px; padding-top: 40px; } }
      .p-shell { color: var(--slate-600); font-size: 18px; line-height: 1.5; margin-bottom: 40px; max-width: 600px; }
      .btn-shell { height: 64px; width: 280px; background: var(--blue); border-radius: 16px; box-shadow: 0 20px 25px -5px rgba(37, 99, 235, 0.2); }
      #root { opacity: 0; }
      .hydrated #root { opacity: 1; transition: opacity 0.3s ease-in; }
      .hydrated #instant-shell { display: none; }
    </style>

    <!-- 3. CARGA DIFERIDA DE TAILWIND (No bloquea el render inicial) -->
    <script src="https://cdn.tailwindcss.com" defer></script>
    <script>
      window.tailwindConfig = {
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'sans-serif'] },
            colors: { blue: { 600: '#2563eb' }, slate: { 900: '#0f172a' } }
          }
        }
      };
    </script>

    <!-- 4. GTM DE BAJA PRIORIDAD (Carga después de 4s para no afectar TBT) -->
    <script>
      setTimeout(() => {
        const s = document.createElement('script');
        s.async = true; s.src = "https://www.googletagmanager.com/gtag/js?id=G-T6JS6Z27GG";
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date()); gtag('config', 'G-T6JS6Z27GG');
      }, 4000);
    </script>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react/": "https://esm.sh/react@^19.2.3/",
        "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
        "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0",
        "vite": "https://esm.sh/vite@^7.3.1",
        "react-router": "https://esm.sh/react-router@^7.12.0"
      }
    }
    </script>
</head>
<body>
    <!-- 5. INSTANT UI: Esto es lo que Google ve primero -->
    <div id="instant-shell">
        <div class="nav-shell"></div>
        <div class="hero-shell">
            <div class="tag-shell">Diseño Web y SEO Local para Pymes</div>
            <h1 class="h1-shell">Diseño Web y SEO que atrae <span style="color:var(--blue)">clientes</span></h1>
            <p class="p-shell">Creamos sistemas web pensados para que tu teléfono suene y entren contactos reales.</p>
            <div class="btn-shell"></div>
        </div>
    </div>

    <div id="root"></div>

    <script type="module">
        // Notificar hidratación
        window.addEventListener('load', () => {
            setTimeout(() => document.body.classList.add('hydrated'), 100);
        });
    </script>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
