    <title>FG Digital Systems | Diseño Web y SEO para Pymes</title>
    
    <!-- 1. DNS & Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <!-- 3. Critical CSS for 100 Performance & 0 CLS -->
    <style>
      :root { --blue-600: #2563eb; --slate-900: #0f172a; --slate-700: #334155; --slate-600: #475569; --slate-50: #f8fafc; }
      body { margin: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: var(--slate-50); color: var(--slate-900); -webkit-font-smoothing: antialiased; }
      #root { min-height: 100vh; display: flex; flex-direction: column; }
      .hero-section { min-height: 60vh; display: flex; align-items: center; justify-content: center; background: #fff; text-align: center; padding: 5rem 1rem; }
      .lcp-title { font-size: 2.5rem; font-weight: 800; line-height: 1.1; color: var(--slate-900); margin-bottom: 1.5rem; letter-spacing: -0.025em; max-width: 900px; margin-left: auto; margin-right: auto; }
      @media (min-width: 768px) { .lcp-title { font-size: 4.5rem; } }
      .lcp-title span { color: var(--blue-600); }
      .hero-sub { color: var(--slate-600); font-size: 1.125rem; max-width: 650px; margin: 0 auto 2.5rem; line-height: 1.6; }
      @media (min-width: 768px) { .hero-sub { font-size: 1.5rem; } }
      .navbar-placeholder { height: 64px; background: white; border-bottom: 1px solid #e2e8f0; width: 100%; position: sticky; top: 0; z-index: 50; }
      .btn-stub { display: inline-flex; height: 60px; width: 280px; background: var(--blue-600); border-radius: 1rem; margin: 0.5rem; }
    </style>

    <!-- 4. Tailwind CDN with defer -->
    <script src="https://cdn.tailwindcss.com?plugins=typography" defer></script>
    <script>
        window.addEventListener('load', function() {
            tailwind.config = {

                }

        });
    </script>

        "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0",

        "react-router": "https://esm.sh/react-router@^7.12.0"

    }

<link rel="stylesheet" href="/index.css">
