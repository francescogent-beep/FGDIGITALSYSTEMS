<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FG Digital Systems | Diseño Web y SEO para Pymes</title>
    
    <!-- 1. DNS & Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <link rel="preconnect" href="https://esm.sh">
    
    <!-- 2. Optimized Font Loading (Removed broken preload) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" media="all">

    <!-- 3. Refined Critical CSS for better LCP -->
    <style>
      :root { --blue-600: #2563eb; --slate-900: #0f172a; --slate-600: #475569; --slate-50: #f8fafc; }
      body { margin: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; background-color: var(--slate-50); color: var(--slate-900); -webkit-font-smoothing: antialiased; }
      #root { min-height: 100vh; display: flex; flex-direction: column; }
      .hero-section { min-height: 60vh; display: flex; align-items: center; justify-content: center; background: #fff; text-align: center; padding: 4rem 1rem; }
      .lcp-title { font-size: 2.25rem; font-weight: 800; line-height: 1.1; color: var(--slate-900); margin-bottom: 1.5rem; letter-spacing: -0.025em; max-width: 900px; margin-left: auto; margin-right: auto; }
      @media (min-width: 768px) { .lcp-title { font-size: 4.5rem; } }
      .lcp-title span { color: var(--blue-600); }
      .navbar-placeholder { height: 64px; background: white; border-bottom: 1px solid #e2e8f0; width: 100%; position: sticky; top: 0; z-index: 50; }
    </style>

    <!-- 4. Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=typography" defer></script>
    <script>
        window.addEventListener('load', function() {
            tailwind.config = {
                theme: {
                    extend: {
                        fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
                        colors: {
                            blue: { 50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd', 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a' },
                        },
                    }
                }
            }
        });
    </script>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react/": "https://esm.sh/react@^19.2.3/",
        "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
        "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0",
        "vite": "https://esm.sh/vite@^7.3.1",
        "react-router": "https://esm.sh/react-router@^7.12.0"
      }
    }
    </script>
    <link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root">
        <div class="navbar-placeholder"></div>
        <div class="hero-section">
            <div style="max-width: 900px; margin: 0 auto; padding: 0 1rem;">
                <h1 class="lcp-title" fetchpriority="high">¿Tu web trae <span>clientes</span> o solo facturas?</h1>
                <div style="height: 60px;"></div>
            </div>
        </div>
    </div>
    <script type="module" src="/index.tsx" defer></script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
