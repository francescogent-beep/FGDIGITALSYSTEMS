<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diseño Web y SEO para Pymes | FG Digital Systems</title>
    <meta name="description" content="Diseño web y SEO local para Pymes. Creamos sistemas web que atraen clientes y aumentan las ventas sin cuotas mensuales ni tecnicismos en Murcia y España.">
    
    <!-- 1. Optimización de Conexiones Prioritarias -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://images.unsplash.com">
    <link rel="dns-prefetch" href="https://www.googletagmanager.com">

    <!-- 2. CSS CRÍTICO (Evita el flickering y acelera el First Paint) -->
    <style>
      :root { --blue-600: #2563eb; --slate-900: #0f172a; --slate-700: #334155; --slate-50: #f8fafc; --white: #ffffff; }
      body { margin: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--slate-50); -webkit-font-smoothing: antialiased; }
      .nav-skeleton { height: 64px; background: rgba(255,255,255,0.9); backdrop-filter: blur(8px); border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 50; width: 100%; }
      .hero-skeleton { padding: 3rem 1rem; text-align: center; background: var(--white); min-height: 40vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
      .title-skeleton { font-size: 2.25rem; font-weight: 800; color: var(--slate-900); margin-bottom: 1.5rem; line-height: 1.1; max-width: 800px; letter-spacing: -0.025em; }
      @media (min-width: 768px) { .title-skeleton { font-size: 4rem; padding-top: 2rem; } }
      .sub-skeleton { color: var(--slate-700); font-size: 1.125rem; max-width: 650px; line-height: 1.6; margin-bottom: 2rem; }
      .btn-skeleton { height: 56px; width: 240px; background: var(--blue-600); border-radius: 1rem; box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3); }
    </style>

    <!-- 3. Tailwind Engine (Carga con config extendida) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'sans-serif'] },
            colors: {
              blue: { 50: '#eff6ff', 100: '#dbeafe', 600: '#2563eb', 700: '#1d4ed8', 900: '#1e3a8a', 950: '#172554' },
              slate: { 700: '#334155', 800: '#1e293b', 900: '#0f172a' }
            }
          }
        }
      }
    </script>

    <!-- 4. Google Tag Manager (Optimizado) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-T6JS6Z27GG"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-T6JS6Z27GG');
    </script>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react/": "https://esm.sh/react@^19.2.3/",
        "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
        "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0",
        "vite": "https://esm.sh/vite@^7.3.1",
        "react-router": "https://esm.sh/react-router@^7.12.0"
      }
    }
    </script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
    <!-- El Skeleton asegura que la primera pintura sea idéntica al resultado final -->
    <div id="root">
        <nav class="nav-skeleton"></nav>
        <main class="hero-skeleton">
            <div class="title-skeleton">Diseño Web y SEO que atrae <span style="color:var(--blue-600)">clientes</span></div>
            <div class="sub-skeleton">Creamos sistemas web para Pymes que funcionan y te posicionan en Google con precios claros.</div>
            <div class="btn-skeleton"></div>
        </main>
    </div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
