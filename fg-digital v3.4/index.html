    <!-- 3. Cargador Híbrido: Tailwind CDN solo en Preview/Dev -->
    <script>
      (function() {
        const isPreview = /localhost|aistudio|usercontent|blob|about/.test(window.location.hostname) || window.location.protocol === 'blob:';
        if (isPreview) {
          console.log('Ambiente de Preview detectado: Activando Tailwind CDN...');
          const script = document.createElement('script');
          script.src = 'https://cdn.tailwindcss.com?plugins=typography';
          script.async = false;
          document.head.appendChild(script);
          
          window.addEventListener('DOMContentLoaded', () => {
            tailwind.config = {

      })();
    </script>
